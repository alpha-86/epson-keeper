printer:
  ip: ""                        # 可选，留空则自动发现（mDNS）；手动指定 IP 作为 fallback
  model: "L4160"                # 必填，用于 epson_print_conf（如 L4150, L4160）
  cups_name: "EPSON_L4160_Series"  # 必填，CUPS 队列名称（运行 `lpstat -p` 查看）

schedule:
  cron: "50 21 * * 3"            # 每周三 21:50（北京时间）

logging:
  level: "INFO"
  file: ""                      # 留空则只输出到 stderr
